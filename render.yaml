# Render — configuração do servidor de WhatsApp (Kairós)
# ---------------------------------------------------------------
# CAMINHO PADRÃO do projeto. Simples: conecta o repositório do GitHub em
# "New → Blueprint", o Render lê este arquivo e cria tudo (imagem Docker,
# disco, plano, checagem de saúde e variáveis).
#
# IMPORTANTE:
#   - Plano "starter" (o grátis NÃO serve: ele dorme e não tem disco)
#   - O disco é obrigatório para a sessão do WhatsApp sobreviver
#   - NÃO cadastre a variável PORT: o Render injeta a porta sozinho e o
#     servidor já lê process.env.PORT.

services:
  - type: web
    name: kairos-whatsapp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # virginia (EUA, costa leste) é a região mais próxima do Brasil no Render.
    region: virginia
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TZ
        value: America/Sao_Paulo
      - key: WPP_AUTH_DIR
        value: /var/data/wpp-auth
      - key: WPP_API_KEY
        sync: false
      - key: WPP_AGENT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
    disk:
      name: wpp-auth
      mountPath: /var/data
      sizeGB: 1